
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie | Transportowe Dzielnice</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #071b36, #123d70);
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      background: #06264b;
      border-bottom: 3px solid #1685ee;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 8px 0 0;
      color: #c8e4ff;
      font-size: 13px;
    }

    main {
      width: 100%;
      max-width: 460px;
      margin: auto;
      padding: 28px 18px;
    }

    .card {
      background: #fff;
      color: #142b45;
      padding: 28px 22px;
      border-radius: 20px;
      box-shadow: 0 15px 45px #0005;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      background: #0879e5;
      color: white;
      font-size: 25px;
      font-weight: bold;
      border-radius: 18px;
    }

    h2 { text-align: center; margin: 8px 0; }

    .subtitle {
      text-align: center;
      color: #66778a;
      font-size: 14px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd7e3;
      border-radius: 10px;
      background: #f8fafc;
      font-size: 16px;
      color: #142b45;
    }

    input:focus, select:focus {
      outline: 2px solid #1685ee;
      border-color: transparent;
    }

    button, .home {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button {
      background: #0879e5;
      color: white;
    }

    button:hover { background: #0563bd; }

    .home {
      background: #eaf3ff;
      color: #0758a8;
      margin-top: 12px;
    }

    #message {
      display: none;
      padding: 12px;
      margin-top: 16px;
      border-radius: 9px;
      background: #fff1d6;
      color: #704600;
      font-size: 14px;
      line-height: 1.5;
    }

    .notice {
      margin-top: 18px;
      color: #64758a;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    footer {
      padding: 18px;
      text-align: center;
      color: #c8e4ff;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🚌 TRANSPORTOWE DZIELNICE</h1>
    <p>Oficjalny portal projektu Roblox</p>
  </header>

  <main>
    <section class="card">
      <div class="logo">TD</div>
      <h2>Panel logowania</h2>
      <p class="subtitle">Dostęp dla pracowników Transportowych Dzielnic</p>

      <form id="loginForm">
        <label for="username">Login pracownika</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="Wpisz swój login"
          autocomplete="username"
          required
        >

        <label for="password">Hasło</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Wpisz swoje hasło"
          autocomplete="current-password"
          required
        >

        <label for="role">Wybierz panel</label>
        <select id="role" name="role" required>
          <option value="kierowca">🚍 Panel kierowcy</option>
          <option value="motorniczy">🚊 Panel motorniczego</option>
          <option value="dyspozytor">📋 Panel dyspozytora</option>
          <option value="administrator">🛡️ Panel administratora</option>
        </select>

        <button type="submit">Zaloguj się</button>
      </form>

      <div id="message" role="status"></div>

      <a class="home" href="index.html">
        ← Powrót na stronę główną
      </a>

      <p class="notice">
        Dostęp tylko dla upoważnionych pracowników.
        Wersja demonstracyjna — nie wpisuj prawdziwego hasła.
      </p>
    </section>
  </main>

  <footer>
    © 2026 Transportowe Dzielnice Roblox
  </footer>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const message = document.getElementById("message");
      message.style.display = "block";
      message.textContent =
        "Formularz działa, ale logowanie nie jest jeszcze podłączone. " +
        "Potrzebny jest system kont i weryfikacji uprawnień.";
    });
  </script>
</body>
  </html>
